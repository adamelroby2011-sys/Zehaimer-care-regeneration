<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Sign in | Zehaimer-care</title>
  <link rel="stylesheet" href="login/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-heart-pulse"></i></div>
    <p class="eyebrow">ZEHAIMER-CARE</p>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your health dashboard.</p>

    <form id="loginForm" novalidate>
      <div class="input-group">
        <label for="email">Email address</label>
        <div class="input-wrap"><i class="fa-regular fa-envelope" aria-hidden="true"></i><input type="email" id="email" autocomplete="username" placeholder="you@example.com" required></div>
        <small id="emailError" class="error" aria-live="polite"></small>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrap password-wrap"><i class="fa-solid fa-lock" aria-hidden="true"></i><input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" id="togglePassword" class="toggle-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
        <small id="passwordError" class="error" aria-live="polite"></small>
      </div>
      <button type="submit" class="primary-button">Sign in <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
      <p class="form-note">Demo sign-in for the Zehaimer-care project.</p>
    </form>
  </main>
  <script src="login/main.js"></script>
</body>
</html>
