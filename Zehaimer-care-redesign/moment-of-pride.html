<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>A Moment of Pride | Zehaimer-care</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:rgba(20,29,51,.92);--border:rgba(148,163,184,.2);--text:#f8fafc;--muted:#aab6cc;--accent:#a78bfa}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(circle at 12% 12%,rgba(59,130,246,.18),transparent 32%),radial-gradient(circle at 88% 85%,rgba(139,92,246,.17),transparent 34%),var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    .card{width:min(100%,420px);overflow:hidden;border:1px solid var(--border);border-radius:26px;background:var(--card);box-shadow:0 22px 60px rgba(0,0,0,.3);transition:transform .2s}.card:hover{transform:translateY(-3px)}
    .image{position:relative;height:clamp(250px,60vh,400px);overflow:hidden;background:#18223b}.image img{width:100%;height:100%;object-fit:cover;object-position:center 20%}.image:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(11,16,32,.7))}
    .content{position:relative;padding:28px;text-align:center}.content:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:56px;height:4px;border-radius:5px;background:var(--accent)}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.22em}.content h1{margin:12px 0;font-size:clamp(25px,6vw,32px)}.subtitle{margin:0 auto 22px;max-width:300px;color:var(--muted);font-size:15px;line-height:1.7}.badge{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border:1px solid rgba(167,139,250,.25);border-radius:99px;color:#ddd6fe;background:rgba(167,139,250,.1);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <main class="card">
    <div class="image"><img src="https://i.imgur.com/GzW7w8K.jpeg" alt="A moment of celebration"></div>
    <section class="content">
      <p class="eyebrow">ZEHAIMER-CARE</p>
      <h1>A Moment of Pride</h1>
      <p class="subtitle">Celebrating excellence, hard work, and the joy of achievement together.</p>
      <span class="badge"><i class="fa-solid fa-star" aria-hidden="true"></i> Congratulations</span>
    </section>
  </main>
</body>
</html>
