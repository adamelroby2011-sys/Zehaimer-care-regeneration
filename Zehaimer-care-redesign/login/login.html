<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moment of Success</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap');

  body {
    background-color: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Lato', sans-serif;
  }

  .card-container {
    background: white;
    width: 380px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.05);
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid rgba(255,255,255,0.5);
  }

  .card-container:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  }

  .image-wrapper {
    position: relative;
    height: 400px; /* Adjust height to focus on faces */
    overflow: hidden;
  }

  .image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Positioning the image to center the faces nicely */
    object-position: center 20%; 
    transition: transform 0.5s ease;
  }

  .card-container:hover .image-wrapper img {
    transform: scale(1.05);
  }

  /* A gold overlay gradient at the bottom of the image */
  .image-wrapper::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 30%;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  }

  .content {
    padding: 25px;
    text-align: center;
    position: relative;
  }

  /* Decorative Gold Line */
  .content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 4px;
    background-color: #D4AF37; /* Gold color */
    border-radius: 2px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    color: #2c3e50;
    margin: 15px 0 10px 0;
    font-size: 1.8rem;
  }

  p.subtitle {
    color: #7f8c8d;
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .badge {
    display: inline-block;
    background-color: #fcf6e5;
    color: #D4AF37;
    padding: 8px 16px;
    border-radius: 50px;
    font-weight: bold;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

</style>
</head>
<body>

<div class="card-container">
  <div class="image-wrapper">
    <!-- Using the image you provided -->
    <img src="https://i.imgur.com/GzW7w8K.jpeg" alt="Celebration with Award">
  </div>
  
  <div class="content">
    <h1>A Moment of Pride</h1>
    <p class="subtitle">Celebrating excellence, hard work, and the joy of achievement together.</p>
    <div class="badge">Congratulations</div>
  </div>
</div>

</body>
</html>
